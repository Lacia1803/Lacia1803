<svg width="880" height="168" viewBox="0 0 880 168" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phùng Võ Quốc Hiển (Lacia) — Fullstack Developer">
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="880" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF9F5" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="glow-light" cx="84%" cy="14%" r="52%" fx="84%" fy="14%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.11" />
      <stop offset="55%" stop-color="#0EA5E9" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-light" x1="0" y1="28" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <pattern id="dots-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748B" fill-opacity="0.22" />
    </pattern>
    <linearGradient id="dots-fade-light" x1="420" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <mask id="dots-mask-light">
      <rect x="420" y="0" width="460" height="168" fill="url(#dots-fade-light)" />
    </mask>
    <clipPath id="card-clip-light">
      <rect x="0.5" y="0.5" width="879" height="167" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-light)">
    <rect width="880" height="168" fill="url(#bg-light)" />
    <rect width="880" height="168" fill="url(#glow-light)" />
    <rect x="420" y="0" width="460" height="168" fill="url(#dots-light)" mask="url(#dots-mask-light)" />
    <rect x="1" y="28" width="3.5" height="112" rx="1.75" fill="url(#accent-light)" />
  </g>

  <rect x="0.5" y="0.5" width="879" height="167" rx="12" stroke="#D8DEE4" stroke-width="1" />

  <!-- Top-left eyebrow -->
  <text x="36" y="42" fill="#57606A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.5">FULLSTACK DEVELOPER  ·  DALAT UNIVERSITY</text>

  <!-- Top-right status pill -->
  <rect x="646" y="24" width="198" height="28" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
  <circle cx="664" cy="38" r="3.5" fill="#10B981" />
  <text x="676" y="42" fill="#065F46" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Open to Fullstack Roles</text>

  <!-- Editorial serif name + monospace handle -->
  <text x="36" y="90" fill="#111827" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="32" font-weight="600">Phùng Võ Quốc Hiển<tspan dx="12" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400">@Lacia1803</tspan></text>

  <!-- Subtitle -->
  <text x="36" y="119" fill="#374151" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Building practical full-stack web apps &amp; internal IT systems.</text>

  <!-- Core stack line -->
  <text x="36" y="144" fill="#57606A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400">TypeScript  ·  Next.js  ·  Node.js  ·  PostgreSQL  ·  Docker</text>

  <!-- Bottom-right Da Lat coordinates -->
  <text x="844" y="144" text-anchor="end" fill="#6E7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" letter-spacing="1">11.94°N · 108.45°E · DA LAT, VN</text>
</svg>
