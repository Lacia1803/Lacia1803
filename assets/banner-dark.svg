<svg width="880" height="168" viewBox="0 0 880 168" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phùng Võ Quốc Hiển (Lacia) — Fullstack Developer">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="880" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11161D" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <radialGradient id="glow-dark" cx="84%" cy="14%" r="52%" fx="84%" fy="14%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#0EA5E9" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-dark" x1="0" y1="28" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <pattern id="dots-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8B949E" fill-opacity="0.18" />
    </pattern>
    <linearGradient id="dots-fade-dark" x1="420" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <mask id="dots-mask-dark">
      <rect x="420" y="0" width="460" height="168" fill="url(#dots-fade-dark)" />
    </mask>
    <clipPath id="card-clip-dark">
      <rect x="0.5" y="0.5" width="879" height="167" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-dark)">
    <rect width="880" height="168" fill="url(#bg-dark)" />
    <rect width="880" height="168" fill="url(#glow-dark)" />
    <rect x="420" y="0" width="460" height="168" fill="url(#dots-dark)" mask="url(#dots-mask-dark)" />
    <rect x="1" y="28" width="3.5" height="112" rx="1.75" fill="url(#accent-dark)" />
  </g>

  <rect x="0.5" y="0.5" width="879" height="167" rx="12" stroke="#30363D" stroke-width="1" />

  <!-- Top-left eyebrow -->
  <text x="36" y="42" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.5">FULLSTACK DEVELOPER  ·  DALAT UNIVERSITY</text>

  <!-- Top-right status pill -->
  <rect x="646" y="24" width="198" height="28" rx="14" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.32" stroke-width="1" />
  <circle cx="664" cy="38" r="3.5" fill="#34D399" />
  <text x="676" y="42" fill="#A7F3D0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Open to Fullstack Roles</text>

  <!-- Editorial serif name + monospace handle -->
  <text x="36" y="90" fill="#F0F6FC" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="32" font-weight="600">Phùng Võ Quốc Hiển<tspan dx="12" fill="#7D8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400">@Lacia1803</tspan></text>

  <!-- Subtitle -->
  <text x="36" y="119" fill="#B1BAC4" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Building practical full-stack web apps &amp; internal IT systems.</text>

  <!-- Core stack line -->
  <text x="36" y="144" fill="#7D8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400">TypeScript  ·  Next.js  ·  Node.js  ·  PostgreSQL  ·  Docker</text>

  <!-- Bottom-right Da Lat coordinates -->
  <text x="844" y="144" text-anchor="end" fill="#6E7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" letter-spacing="1">11.94°N · 108.45°E · DA LAT, VN</text>
</svg>
